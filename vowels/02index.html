<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akey Online Studio</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.6);
            --text-color: #444444; 
            --error-red: rgba(255, 100, 100, 0.9);
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif; }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(120deg, #ff9a9e, #fad0c4, #fbc2eb, #a1c4fd, #c2e9fb, #d4fc79);
            background-size: 600% 600%;
            animation: rainbowFlow 30s ease infinite; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        @keyframes rainbowFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .glass-container {
            width: 90%;
            max-width: 400px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid var(--glass-border);
            border-radius: 40px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            color: var(--text-color);
            position: relative;
        }
        #feedback-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--error-red);
            border-radius: 40px;
            z-index: 10;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .correct-ans-label { font-size: 18px; margin-bottom: 5px; }
        .correct-word { font-size: 65px; font-weight: bold; text-transform: uppercase; text-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .header { font-size: 15px; font-weight: bold; opacity: 0.7; margin-bottom: 15px; }
        #speaker-btn {
            font-size: 90px;
            background: none;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
            margin: 15px 0;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }
        #speaker-btn:active { transform: scale(0.85); }
        .options-grid { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        .option-btn {
            background: rgba(255, 255, 255, 0.6);
            border: 1.5px solid var(--glass-border);
            padding: 18px;
            color: #444;
            font-size: 24px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .option-btn:active { background: #fff; transform: translateY(2px); }
        #score-board { font-size: 20px; font-weight: bold; margin-bottom: 5px; color: #555; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 5px;
        }
        .unit-label {
            font-size: 18px;
            font-weight: bold;
            opacity: 0.7;
            color: #555;
        }
        #result-screen { display: none; }
        .big-score { font-size: 110px; font-weight: bold; margin: 15px 0; color: #ff6b6b; text-shadow: 0 4px 0px #fff; }
    </style>
</head>
<body>
    <div class="glass-container" id="quiz-area">
        <div id="feedback-overlay">
            <div class="correct-ans-label">Watch Out! It's:</div>
            <div class="correct-word" id="show-correct-word">BAKE</div>
        </div>
        <div class="status-bar">
            <div style="text-align: left;">
                <div id="score-board">Score: <span id="current-score">0</span></div>
                <div class="header" id="progress" style="margin-bottom: 0;">Q: 1 / 20</div>
            </div>
            <div class="unit-label">Long Vowels</div>
        </div>
        
        <button id="speaker-btn" onclick="playQuizAudio()">🔊</button>
        <p style="font-weight: bold; opacity: 0.8;">Listen & Choose the Word</p>
        <div class="options-grid" id="options-container"></div>
    </div>

    <div class="glass-container" id="result-screen">
        <h2 style="letter-spacing: 2px;">SUPER STAR!</h2>
        <div class="big-score" id="final-score">0</div>
        <p style="font-size: 18px; font-weight: bold;">TOTAL POINTS</p>
        
        <!-- 修改後的按鈕區域 -->
        <div class="options-grid" style="margin-top: 25px;">
            <button class="option-btn" onclick="location.reload()" style="background: rgba(255,255,255,0.5);">
                🔄 Play Long Vowels Again
            </button>
            <button class="option-btn" onclick="window.location.href='03index.html'" style="background: #fff; border: 2px solid #ff6b6b;">
                ➡️ Next: "Vowels"
            </button>
        </div>
    </div>

    <script>
        const quizData = [
            { t: "bake", o: ["bake", "back", "bike", "beak"] },
            { t: "bike", o: ["bike", "back", "bake", "bit"] },
            { t: "bone", o: ["bone", "bun", "bean", "born"] },
            { t: "cute", o: ["cute", "cut", "coat", "cat"] },
            { t: "cage", o: ["cage", "cake", "cap", "cog"] },
            { t: "dime", o: ["dime", "dim", "dome", "dam"] },
            { t: "code", o: ["code", "cod", "cold", "cord"] },
            { t: "cube", o: ["cube", "cub", "tube", "cab"] },
            { t: "cake", o: ["cake", "coke", "can", "cook"] },
            { t: "dive", o: ["dive", "drive", "dove", "did"] },
            { t: "cope", o: ["cope", "cop", "cap", "cape"] },
            { t: "dude", o: ["dude", "dad", "did", "dune"] },
            { t: "cape", o: ["cape", "cap", "cope", "cop"] },
            { t: "fine", o: ["fine", "fin", "fan", "fun"] },
            { t: "dome", o: ["dome", "dime", "dam", "do"] },
            { t: "dune", o: ["dune", "done", "den", "dude"] },
            { t: "fame", o: ["fame", "farm", "foam", "fan"] },
            { t: "kite", o: ["kite", "kit", "kate", "kat"] },
            { t: "hose", o: ["hose", "house", "has", "his"] },
            { t: "fuse", o: ["fuse", "fuss", "fish", "fox"] }
        ];
        quizData.sort(() => Math.random() - 0.5);
        let score = 0;
        let currentIdx = 0;
        let isWaiting = false;

        function loadQuestion() {
            isWaiting = false;
            document.getElementById('feedback-overlay').style.display = 'none';
            const q = quizData[currentIdx];
            document.getElementById('progress').innerText = `Q: ${currentIdx + 1} / ${quizData.length}`;
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            const shuffledOptions = [...q.o].sort(() => Math.random() - 0.5);
            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, q.t);
                container.appendChild(btn);
            });
        }

        function playQuizAudio() {
            if (isWaiting) return;
            const msg = new SpeechSynthesisUtterance(quizData[currentIdx].t);
            msg.lang = 'en-US';
            msg.rate = 0.75;
            window.speechSynthesis.speak(msg);
        }

        function checkAnswer(selected, correct) {
            if (isWaiting) return;
            isWaiting = true;

            if (selected === correct) {
                score += 5; 
                new Audio('correct.mp3').play().catch(()=>{});
                document.getElementById('current-score').innerText = score;
                proceedNext();
            } else {
                new Audio('wrong.mp3').play().catch(()=>{});
                document.getElementById('show-correct-word').innerText = correct.toUpperCase();
                document.getElementById('feedback-overlay').style.display = 'flex';
                setTimeout(proceedNext, 1800); 
            }
        }

        function proceedNext() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            // 隱藏題目區，顯示結果區
            document.getElementById('quiz-area').style.display = 'none';
            const resultScreen = document.getElementById('result-screen');
            resultScreen.style.display = 'block';
            document.getElementById('final-score').innerText = score;
            new Audio('cheer.mp3').play().catch(()=>{});
            
            // 已移除原本的自動倒數計時邏輯，改為讓使用者點擊按鈕
        }

        loadQuestion();
    </script>
</body>
</html>
