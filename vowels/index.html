<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akey Online Studio</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.2);
            --glass-border: rgba(255, 255, 255, 0.3);
            --text-color: #ffffff;
            --error-red: rgba(255, 60, 60, 0.8);
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background 0.5s;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-container {
            width: 90%;
            max-width: 400px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
            text-align: center;
            color: var(--text-color);
            position: relative;
        }

        #feedback-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--error-red);
            border-radius: 30px;
            z-index: 10;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .correct-ans-label { font-size: 18px; margin-bottom: 10px; }
        .correct-word { font-size: 60px; font-weight: bold; text-transform: uppercase; text-shadow: 0 0 20px white; }

        .header { font-size: 14px; opacity: 0.8; margin-bottom: 20px; }

        #speaker-btn {
            font-size: 80px;
            background: none;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
            margin: 20px 0;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));
        }
        #speaker-btn:active { transform: scale(0.9); }

        .options-grid { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }

        .option-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            padding: 15px;
            color: white;
            font-size: 22px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .option-btn:hover { background: rgba(255, 255, 255, 0.3); }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        #score-board { font-size: 18px; margin-bottom: 0; text-align: left; }
        .unit-tag { font-size: 18px; font-weight: bold; opacity: 0.8; }

        #result-screen { display: none; }
        .big-score { font-size: 100px; font-weight: bold; margin: 20px 0; text-shadow: 0 0 20px rgba(255,255,255,0.5); }
    </style>
</head>
<body>

    <div class="glass-container" id="quiz-area">
        <div id="feedback-overlay">
            <div class="correct-ans-label">Correct Answer:</div>
            <div class="correct-word" id="show-correct-word">CAT</div>
        </div>

        <div class="status-bar">
            <div id="score-board">Score: <span id="current-score">0</span></div>
            <div class="unit-tag">Short Vowels</div>
        </div>
        
        <div class="header" id="progress" style="text-align: left;">Question: 1 / 25</div>
        
        <button id="speaker-btn" onclick="playQuizAudio()">🔊</button>
        <p>Listen and Choose</p>

        <div class="options-grid" id="options-container"></div>
    </div>

    <div class="glass-container" id="result-screen">
        <h2>MISSION COMPLETE</h2>
        <div class="big-score" id="final-score">0</div>
        <p>POINTS</p>
        <!-- 這裡的按鈕會被 JS 產生的二選一按鈕取代 -->
        <button class="option-btn" onclick="location.reload()" style="margin-top:20px; width:100%;">Play Again</button>
    </div>

    <script>
        const quizData = [
            { t: "cat", o: ["cat", "cut", "cot", "cap"] },
            { t: "map", o: ["map", "mop", "mad", "mat"] },
            { t: "bag", o: ["bag", "beg", "big", "bug"] },
            { t: "fan", o: ["fan", "fun", "fin", "pan"] },
            { t: "sad", o: ["sad", "sid", "sod", "seed"] },
            { t: "bed", o: ["bed", "bad", "bid", "bud"] },
            { t: "pet", o: ["pet", "pat", "pit", "pot"] },
            { t: "hen", o: ["hen", "han", "pen", "ten"] },
            { t: "leg", o: ["leg", "lag", "log", "lug"] },
            { t: "net", o: ["net", "not", "nut", "neat"] },
            { t: "sit", o: ["sit", "sat", "set", "seat"] },
            { t: "pig", o: ["pig", "peg", "pag", "pug"] },
            { t: "pin", o: ["pin", "pan", "pen", "pun"] },
            { t: "hit", o: ["hit", "hat", "hot", "hut"] },
            { t: "lid", o: ["lid", "lad", "led", "ladle"] },
            { t: "hot", o: ["hot", "hat", "hit", "hut"] },
            { t: "pot", o: ["pot", "pat", "pet", "pit"] },
            { t: "log", o: ["log", "lag", "leg", "lug"] },
            { t: "top", o: ["top", "tap", "tip", "tape"] },
            { t: "hop", o: ["hop", "hip", "hap", "hope"] },
            { t: "bug", o: ["bug", "bag", "beg", "bog"] },
            { t: "cut", o: ["cut", "cat", "cot", "cute"] },
            { t: "cup", o: ["cup", "cap", "cop", "cape"] },
            { t: "sun", o: ["sun", "san", "sin", "soon"] },
            { t: "bus", o: ["bus", "bas", "bos", "base"] }
        ];

        quizData.sort(() => Math.random() - 0.5);

        let score = 0;
        let currentIdx = 0;
        let isWaiting = false;

        function loadQuestion() {
            isWaiting = false;
            document.getElementById('feedback-overlay').style.display = 'none';
            const q = quizData[currentIdx];
            document.getElementById('progress').innerText = `Question: ${currentIdx + 1} / 25`;
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            const shuffledOptions = [...q.o].sort(() => Math.random() - 0.5);
            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, q.t);
                container.appendChild(btn);
            });
        }

        function playQuizAudio() {
            if (isWaiting) return;
            const msg = new SpeechSynthesisUtterance(quizData[currentIdx].t);
            msg.lang = 'en-US';
            msg.rate = 0.8;
            window.speechSynthesis.speak(msg);
        }

        function checkAnswer(selected, correct) {
            if (isWaiting) return;
            isWaiting = true;

            if (selected === correct) {
                score += 4;
                new Audio('correct.mp3').play().catch(()=>{});
                document.getElementById('current-score').innerText = score;
                proceedNext();
            } else {
                new Audio('wrong.mp3').play().catch(()=>{});
                document.getElementById('show-correct-word').innerText = correct.toUpperCase();
                document.getElementById('feedback-overlay').style.display = 'flex';
                setTimeout(proceedNext, 1500);
            }
        }

        function proceedNext() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            // 隱藏測驗區
            document.getElementById('quiz-area').style.display = 'none';
            
            // 顯示結果螢幕
            const resultScreen = document.getElementById('result-screen');
            resultScreen.style.display = 'block';
            document.getElementById('final-score').innerText = score;
            new Audio('cheer.mp3').play().catch(()=>{});

            // 處理按鈕：隱藏原有 Play Again，新增二選一容器
            const originalBtn = resultScreen.querySelector('button');
            if (originalBtn) originalBtn.style.display = 'none';

            // 建立按鈕容器
            const actionContainer = document.createElement('div');
            actionContainer.className = "options-grid";
            actionContainer.style.marginTop = "30px";
            
            // 選項 1: 重新挑戰 Short Vowels
            const btnRetry = document.createElement('button');
            btnRetry.className = 'option-btn';
            btnRetry.style.background = "rgba(255, 255, 255, 0.15)";
            btnRetry.innerHTML = "🔄 Play 'Short Vowels' Again";
            btnRetry.onclick = () => location.reload();

            // 選項 2: 進入 Long Vowels (加強視覺導引)
            const btnNext = document.createElement('button');
            btnNext.className = 'option-btn';
            btnNext.style.background = "rgba(255, 255, 255, 0.3)";
            btnNext.style.border = "1.5px solid #fdbb2d";
            btnNext.innerHTML = "➡️ Next: 'Long Vowels'";
            btnNext.onclick = () => {
                window.location.href = '02index.html';
            };

            actionContainer.appendChild(btnRetry);
            actionContainer.appendChild(btnNext);
            resultScreen.appendChild(actionContainer);
        }

        loadQuestion();
    </script>
</body>
</html>
